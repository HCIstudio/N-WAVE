services:
  mongodb:
    image: mongo:7
    container_name: nwave-mongodb
    restart: unless-stopped
    ports:
      # MongoDB has no password: never reachable from other machines.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # The nf-core catalog, kept once in the frontend (see backend/Dockerfile).
      additional_contexts:
        nfcore: ./frontend/src/registry/nfcore
    container_name: nwave-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://mongodb:27017/nwave
      # Always run Nextflow in a container (no host binary assumption).
      NEXTFLOW_EXECUTION_MODE: docker
      BACKEND_CONTAINER_NAME: nwave-backend
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost
      NWAVE_CUSTOM_NODE_DIR: /app/custom-nodes
      # A GitHub access token for downloading nf-core pipelines past GitHub's
      # limit for anonymous downloads (set it in the shell or a .env file).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Most a run may use (defaults: all CPUs, 80% of memory) and the time
      # limit in minutes for runs that set none (default 1440; 0 = none).
      # NWAVE_MAX_CPUS: 8
      # NWAVE_MAX_MEMORY: 24 GB
      # NWAVE_EXECUTION_TIMEOUT: 1440
    # Ports are bound to 127.0.0.1: N-WAVE has no login and the backend can
    # start containers on the host's Docker. NWAVE_BIND_ADDRESS=0.0.0.0 opens
    # them to your network (trusted networks only).
    ports:
      - "${NWAVE_BIND_ADDRESS:-127.0.0.1}:5001:5001"
    volumes:
      - ./results:/app/results
      - ./frontend/src/registry/custom/nodes:/app/custom-nodes
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
        BUILD_DATE: ${BUILD_DATE:-}
        GIT_SHA: ${GIT_SHA:-}
    container_name: nwave-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NWAVE_BIND_ADDRESS:-127.0.0.1}:5173:80"

volumes:
  mongodb_data:
