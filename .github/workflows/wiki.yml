# Publishes the wiki pages in wiki/ to the GitHub wiki after every merge that changes them,
# so the wiki always describes main (see wiki/README.md and scripts/publish-wiki.sh).
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "scripts/publish-wiki.sh"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write # push to the wiki repository

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish wiki/ to the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          scripts/publish-wiki.sh "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
          else
            git commit -m "Update from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7} (wiki/)"
            git push
          fi
