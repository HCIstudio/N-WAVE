name: Release

# Auto-versioning: every push to main steps the patch version (derived from the
# latest v* tag). To release a minor or major version instead, set it in both
# frontend/package.json and backend/package.json in the pull request (e.g.
# 1.2.0); a package.json version above the latest tag is used as-is. Either way
# the version is applied everywhere in the same run:
#   - injected into the Pages demo build (the site footer shows it),
#   - injected into the Docker images (:<version> + :latest, linux/amd64 and
#     linux/arm64) pushed to Docker Hub,
#   - written back into frontend/ and backend/package.json and committed to main,
#   - tagged v<version> with a GitHub Release.
#
# You never set the version by hand.
#
# The bump commit is committed back to main using a repo-admin PAT stored as the
# RELEASE_TOKEN secret (admins bypass the main ruleset, which is otherwise
# PR-only). A PAT push re-triggers this workflow, so the `version` job below is
# guarded to ignore its own "chore(release):" commits — no release loop. See the
# README "Versioning" section for the one-time PAT setup.
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

# Each job asks for what it needs, nothing for the workflow as a whole.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  BACKEND_IMAGE: hcistudio/nwave-backend
  FRONTEND_IMAGE: hcistudio/nwave-frontend
  BIOFLOW_IMAGE: hcistudio/nwave-bioflow

jobs:
  # Decide the next version once, so every downstream job uses the same number.
  version:
    # Ignore our own version-bump commits so we don't release in a loop (the bump
    # is pushed with a PAT, which — unlike GITHUB_TOKEN — re-triggers workflows).
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need all tags to find the latest version
          persist-credentials: false
      - name: Compute next version
        id: v
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="0.1.0"
          else
            v=${latest#v}
            IFS='.' read -r major minor patch <<< "$v"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
            next="${major}.${minor}.$((patch + 1))"
          fi

          # A version set by hand in package.json (e.g. a minor bump to 1.2.0)
          # wins when it is newer than the latest tag.
          frontend=$(node -p 'require("./frontend/package.json").version')
          backend=$(node -p 'require("./backend/package.json").version')
          if [ "$frontend" != "$backend" ]; then
            echo "::error::frontend ($frontend) and backend ($backend) package.json versions differ"
            exit 1
          fi
          if ! [[ "$frontend" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '$frontend' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          newest=$(printf '%s\n%s\n' "${latest#v}" "$frontend" | sort -V | tail -n1)
          if [ -n "$latest" ] && [ "$frontend" != "${latest#v}" ] && [ "$newest" = "$frontend" ]; then
            echo "Using the version set in package.json: $frontend"
            next="$frontend"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Next version: v$next (from ${latest:-<none>})"

  # Deploy the demo to GitHub Pages with the new version injected.
  pages:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # deploy the demo to Pages
      id-token: write # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.14.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build demo site
        working-directory: frontend
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: pnpm run build
      - name: Add SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Build/push the images, write the version into package.json + commit, release.
  release:
    needs: version
    runs-on: ubuntu-latest
    # A normal release takes a few minutes (the arm64 image half is emulated).
    # Without a limit a hung build holds the `release` concurrency group for
    # GitHub's 6-hour default, and every merge in the meantime is cancelled.
    timeout-minutes: 60
    permissions:
      contents: write # the GitHub release (the bump commit and tag are pushed with RELEASE_TOKEN)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # PAT from a repo admin (admins bypass the main ruleset) so the version
          # bump can be committed back to main. See README "Versioning".
          token: ${{ secrets.RELEASE_TOKEN }}
          # Kept for the push of the bump commit and tag below; no artifact is uploaded from this job.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Write version into package.json files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            for (const path of ["frontend/package.json", "backend/package.json"]) {
              const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
              pkg.version = version;
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            }
          ' "$VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # The nf-core catalog, kept once in the frontend (see backend/Dockerfile).
          build-contexts: |
            nfcore=./frontend/src/registry/nfcore
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ needs.version.outputs.version }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Root context on purpose: the frontend Dockerfile copies
          # frontend/package.json and the repo .git directory.
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ needs.version.outputs.version }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

      - name: Build & push the workflow analysis
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # BioFlow-Insight (backend/bioflow); the backend runs the image of its own version.
          context: ./backend/bioflow
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BIOFLOW_IMAGE }}:latest
            ${{ env.BIOFLOW_IMAGE }}:${{ needs.version.outputs.version }}
          cache-from: type=registry,ref=${{ env.BIOFLOW_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BIOFLOW_IMAGE }}:buildcache,mode=max

      - name: Commit version bump and tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          version="$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json backend/package.json
          # A version set by hand in the PR (e.g. 1.2.0) is already in both
          # package.json files, so there may be nothing to commit: then only tag.
          if git diff --cached --quiet; then
            echo "package.json files already at v${version}; tagging only"
          else
            git commit -m "chore(release): v${version}"
            # Uses the RELEASE_TOKEN PAT from the checkout above. This re-triggers
            # the workflow, but the `version` job ignores "chore(release):" commits.
            git push origin HEAD:main
          fi
          git tag "v${version}"
          git push origin "v${version}"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes=$(cat <<NOTES
          Automated release — the version is stepped automatically on each merge to \`main\`.

          **Docker images** (linux/amd64 and linux/arm64)
          - \`${BACKEND_IMAGE}:${VERSION}\` (also \`:latest\`)
          - \`${FRONTEND_IMAGE}:${VERSION}\` (also \`:latest\`)
          - \`${BIOFLOW_IMAGE}:${VERSION}\` (also \`:latest\`): the workflow analysis, downloaded on first use

          **Run it**
          \`\`\`bash
          docker compose -f latest.yml up -d
          \`\`\`
          NOTES
          )
          # The notes above, then GitHub's generated notes (the merged pull requests).
          gh release create "$TAG" latest.yml --verify-tag --title "$TAG" --notes "$notes" --generate-notes
