name: Test

# The required gate for merging into main. It runs on every pull request (and on
# main as a safety net): lint, unit tests, typecheck, and build — all blocking.
#
# Biome (frontend/biome.json, backend/biome.json) runs the recommended rule
# set with no rules disabled; justified exceptions use inline biome-ignore
# comments that state a reason.
on:
  pull_request:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend
    # Skip the automated version-bump commits that release.yml pushes to main.
    if: >-
      ${{ github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:coverage

      - name: Typecheck & build
        run: pnpm build

  backend:
    name: Backend
    # Skip the automated version-bump commits that release.yml pushes to main.
    if: >-
      ${{ github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:coverage

      - name: Typecheck & build
        run: pnpm build

  e2e:
    name: E2E (canvas flow)
    # Separate and non-blocking for now: browser tests are slower and can be
    # flakier than the unit gate. Make it required once it has proven stable.
    if: >-
      ${{ github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
