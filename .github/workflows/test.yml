name: Test

# The required gate for merging into main. It runs on every pull request (and on
# main as a safety net): lint, unit tests, typecheck, and build — all blocking.
#
# Biome (frontend/biome.json, backend/biome.json) runs the recommended rule
# set; the only rule disabled is the frontend's noTemplateCurlyInString (its
# generated Nextflow code has Groovy `${...}` in plain strings). Justified
# exceptions use inline biome-ignore comments that state a reason.
on:
  pull_request:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend
    # Skip the automated version-bump commits that release.yml pushes to main.
    if: >-
      ${{ github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:coverage

      - name: nf-core catalog parser tests
        run: node --test ../scripts/*.test.mjs

      - name: Typecheck & build
        run: pnpm build

  backend:
    name: Backend
    # Skip the automated version-bump commits that release.yml pushes to main.
    if: >-
      ${{ github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:coverage

      - name: Typecheck & build
        run: pnpm build

  nextflow-lint:
    name: Generated Nextflow (lint)
    # The built-in examples and representative node combinations, exported
    # and as the backend runs them, checked with `nextflow lint` (pinned
    # image). Fails on lint errors; see scripts/lint-generated-nextflow.sh.
    if: >-
      ${{ github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    env:
      NEXTFLOW_LINT_IMAGE: nextflow/nextflow:25.10.4
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile

      - name: Lint generated Nextflow
        run: scripts/lint-generated-nextflow.sh

  e2e:
    name: E2E (canvas flow)
    # Separate and non-blocking for now: browser tests are slower and can be
    # flakier than the unit gate. Make it required once it has proven stable.
    if: >-
      ${{ github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
