# Weekly dependency updates. npm minor and patch bumps are grouped per package
# so they arrive as one pull request each. npm major versions are not proposed:
# they need migration work and are planned as issues instead. GitHub Actions
# and Docker base images keep their major updates (Node majors excepted).
# Every update waits 7 days after its release (cooldown), so a compromised
# release is usually caught and pulled before it is proposed here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Node major upgrades are deliberate (CI pins Node 20 too).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Node major upgrades are deliberate (CI pins Node 20 too).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # The workflow analysis (backend/bioflow): BioFlow-Insight only, one version
  # at a time and never merged on its own. Its dependencies stay as pinned
  # until an update needs others. Every update goes through
  # backend/bioflow/UPDATING.md.
  - package-ecosystem: pip
    directory: /backend/bioflow
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels: [bioflow-update]
    allow:
      - dependency-name: bioflow-insight
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /backend/bioflow
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels: [bioflow-update]
    ignore:
      # bioflow-insight 2.1.1 needs numpy 1.26, which installs on Python 3.12 at most.
      - dependency-name: python
        versions: [">=3.13"]
    cooldown:
      default-days: 7
